# Smoke test: 10 workers, 200 tasks x 1M paths.
# CPU requests are sized for a single 16-vCPU VM running k3s.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: montecarlo-smoke
  namespace: quant-team
  labels:
    kueue.x-k8s.io/queue-name: hpc-local
spec:
  suspend: true
  entrypoint: python /app/price_option.py
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 900
  runtimeEnvYAML: |
    env_vars:
      NUM_TASKS: "200"
  rayClusterSpec:
    rayVersion: "2.55.1"
    authOptions:
      mode: token
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
      template:
        spec:
          containers:
            - name: ray-head
              image: rayproject/ray:2.55.1
              resources:
                requests: { cpu: "1", memory: 2Gi }
                limits:   { cpu: "2", memory: 4Gi }
              volumeMounts:
                - name: montecarlo-src
                  mountPath: /app
          volumes:
            - name: montecarlo-src
              configMap:
                name: montecarlo-src
    workerGroupSpecs:
      - groupName: simulators
        replicas: 10
        minReplicas: 10
        maxReplicas: 10
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: rayproject/ray:2.55.1
                resources:
                  requests: { cpu: "1", memory: 2Gi }
                  limits:   { cpu: "1", memory: 4Gi }
